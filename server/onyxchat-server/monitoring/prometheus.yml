global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: onyxchat
    static_configs:
      - targets: ["server:8080"]
    metrics_path: /metrics

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:9091"]
    metrics_path: /metrics
